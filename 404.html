<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="4;url=/report-2026-landing/charlas-tecnicas/">
  <title>Redireccionando | REPORT 2026</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f8f9; color: #111318; }
    main { width: min(100% - 40px, 520px); padding: 42px 28px; text-align: center; border: 1px solid #e3e7eb; border-radius: 24px; background: #fff; box-shadow: 0 18px 45px rgba(17, 19, 24, .08); }
    .mark { width: 44px; height: 44px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 14px 5px 14px 5px; background: #b8e923; font-size: 24px; font-weight: 900; }
    h1 { margin: 0 0 14px; font-size: clamp(26px, 6vw, 38px); line-height: 1.05; letter-spacing: -.045em; }
    p { margin: 0 0 24px; color: #68717c; line-height: 1.65; }
    a { display: inline-flex; min-height: 46px; align-items: center; padding: 0 18px; border-radius: 999px; background: #111318; color: #fff; text-decoration: none; font-weight: 800; }
    a:hover, a:focus-visible { background: #2a2d34; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">R</div>
    <h1>Te estamos llevando a REPORT 2026.</h1>
    <p>La dirección de la agenda fue actualizada. En unos segundos vas a acceder a la URL vigente.</p>
    <a href="/report-2026-landing/charlas-tecnicas/">Ir a Charlas Técnico Comerciales</a>
  </main>
  <script>
    (() => {
      const cleanUrl = '/report-2026-landing/charlas-tecnicas/';
      const currentPath = decodeURIComponent(window.location.pathname).replace(/\/+$/, '') || '/';
      const oldPath = '/report-2026-landing/charlas-técnicas';
      if (currentPath === oldPath) window.location.replace(cleanUrl);
    })();
  </script>
</body>
</html>
